name: Publish Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: gh-pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Apply
        env:
          A4760E: ${{ secrets.A4760E }}
          BDE9C4: ${{ secrets.BDE9C4 }}
        run: |
          python3 -c "
          import os, sys, pathlib
          tag_a = os.environ.get('A4760E', '')
          tag_b = os.environ.get('BDE9C4', '')
          fpath = pathlib.Path('index.html')
          orig = fpath.read_text(encoding='utf-8')
          updated = orig
          if tag_a:
              updated = updated.replace('<!-- af42f7e86bfc75c00b199fc9b4bb -->', tag_a)
          if tag_b:
              updated = updated.replace('<!-- b53e568a3fccfc1a6eb6987b01e5 -->', tag_b)
          if updated == orig and (tag_a or tag_b):
              sys.exit(1)
          if updated != orig:
              fpath.write_text(updated, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: publish
        uses: actions/deploy-pages@v4
